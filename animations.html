<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tasks 8–10</title><link rel="stylesheet" href="style.css"></head><body>
<nav><a href="index.html">Home</a><a href="selectors.html">Task 1</a><a href="effects.html">Tasks 2–4</a><a href="dom.html">Tasks 5–7</a><a href="animations.html">Tasks 8–10</a><a href="mini-project.html">Task 11</a></nav><main><h1>Tasks 8–10 — Animations</h1>
<div class="stage"><div id="box"></div></div><button id="basic">Basic Animation</button><button id="sequence">Sequential Animation</button><button id="combined">Combined Animation</button><button id="reset">Reset</button>
</main><script src="https://code.jquery.com/jquery-3.7.1.min.js"></script><script>
$(document).ready(function(){
 const b=$("#box");
 $("#basic").click(()=>b.animate({width:"130px",height:"130px",left:"180px"},700));
 $("#sequence").click(()=>b.animate({left:"260px"},500).animate({top:"180px"},500).animate({width:"40px",height:"40px"},500).animate({left:"0",top:"0",width:"70px",height:"70px"},500));
 $("#combined").click(()=>b.animate({left:"220px",top:"100px",width:"120px",height:"120px",opacity:.35},900));
 $("#reset").click(()=>b.stop(true).css({left:0,top:0,width:"70px",height:"70px",opacity:1}));
});
</script></body></html>
